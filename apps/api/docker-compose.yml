services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: zyron
      POSTGRES_PASSWORD: zyron
      POSTGRES_DB: zyron_accounts
    ports:
      - "5432:5432"
    volumes:
      - zyron-api-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyron -d zyron_accounts"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  zyron-api-pg:
