services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: zyron
      POSTGRES_PASSWORD: zyron
      POSTGRES_DB: zyron_accounts
    ports:
      - "5432:5432"
    volumes:
      - zyron-api-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyron -d zyron_accounts"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8788:8788"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://zyron:zyron@postgres:5432/zyron_accounts
      PORT: "8788"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  zyron-api-pg:
