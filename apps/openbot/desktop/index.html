<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenBot</title>
    <script>
      // Tauri webview compatibility shim for embedded browser environments
      if (typeof window !== "undefined" && !window.__TAURI_INTERNALS__) {
        window.__TAURI_EVENT_PLUGIN_INTERNALS__ = {
          unregisterListener: function () {},
        };
        window.__TAURI_INTERNALS__ = {
          invoke: async function (command, args) {
            console.log("[Tauri Shim] invoke:", command, args);
            switch (command) {
              case "connection":
                return { mode: "local", address: "http://127.0.0.1:3001", signedIn: false };
              case "take_connection_notice":
                return null;
              case "security_floor":
                return { blocked: false };
              case "default_root":
                return "/home/kyzedev/zyron/apps/openbot";
              case "already_configured":
                return null;
              case "take_ai_connection_change":
              case "already_running":
              case "windows_restart_pending":
                return false;
              case "show_openbot":
              case "show_connected":
                try {
                  window.location.href =
                    "http://127.0.0.1:3001/api/install/enter?token=1b51c90286b2846212078c0f544eb35697b82fc092cf628312b8a6f9f1d9de4a&to=/";
                } catch (e) {}
                return true;
              case "plugin:opener|open_url":
                if (args && args.url) window.open(args.url, "_blank");
                return true;
              case "plugin:event|listen":
                return 1;
              case "plugin:event|unlisten":
                return true;
              default:
                return true;
            }
          },
          transformCallback: function (callback) {
            return function (payload) {
              return callback(payload);
            };
          },
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
